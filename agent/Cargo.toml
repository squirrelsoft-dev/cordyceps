[package]
name = "agent"
version = "0.1.0"
edition = "2021"
publish = false
description = "Cordyceps HillClimber harness — spore-core example 12 (12-cordyceps) pulled in as the agent for the v0.0.1 keystone proof. Selectable loop strategy (react / plan-execute / hillclimb) so the single-shot baselines and the climb run from one binary."

[[bin]]
name = "agent"
path = "src/main.rs"

[dependencies]
# Pulled in from the sibling spore-core checkout. The harness runtime lives there;
# this crate only architects a strategy-selectable harness on top of it.
spore-core = { path = "../../spore-core/rust/crates/spore-core" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
# Raw-mode key input so a bare Esc can abort a running task (no Enter needed).
crossterm = "0.28"
